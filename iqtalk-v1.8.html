<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IQTalk — P2P Walkie Talkie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        
        /* Custom scrollbar for lobby list */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* PTT Button animations */
        .ptt-active {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
            transform: scale(0.96);
        }
        @keyframes pulse-green {
            to { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }

        /* Voice wave animation */
        .wave-bar { display: inline-flex; gap: 3px; align-items: center; height: 16px; margin-left: 8px; }
        .wb { width: 3px; border-radius: 2px; background: white; animation: wave 0.7s ease-in-out infinite; }
        .wb:nth-child(1){height:6px;animation-delay:0s}
        .wb:nth-child(2){height:14px;animation-delay:0.1s}
        .wb:nth-child(3){height:18px;animation-delay:0.2s}
        .wb:nth-child(4){height:14px;animation-delay:0.3s}
        .wb:nth-child(5){height:6px;animation-delay:0.4s}
        @keyframes wave{0%,100%{transform:scaleY(0.4);opacity:0.5}50%{transform:scaleY(1);opacity:1}}
        
        .hidden-el { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6 overflow-hidden">

    <div class="w-full max-w-md flex flex-col flex-1 gap-4 relative">
        
        <!-- Header -->
        <div class="text-center py-4 shrink-0">
            <h1 class="text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <i class="ph-fill ph-radio text-emerald-500"></i>
                IQ<span class="text-emerald-500">Talk</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Mesh PTT Network</p>
        </div>

        <!-- 1. Setup View -->
        <div id="view-setup" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex-1 flex flex-col justify-center animate-fade-in">
            <div class="mb-6 text-center">
                <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-700">
                    <i class="ph ph-user text-2xl text-slate-400"></i>
                </div>
                <h2 class="text-lg font-medium text-white">Join the Network</h2>
                <p class="text-sm text-slate-400 mt-1">Enter a display name to appear in the lobby.</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Your Name</label>
                    <input type="text" id="myNameInput" placeholder="e.g. Alex, Alpha Team..." maxlength="20" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
                </div>
                
                <button id="joinBtn" onclick="joinApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl px-4 py-3.5 transition-all active:scale-95 flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                    <span>Connect & Join Lobby</span>
                    <i class="ph ph-arrow-right font-bold"></i>
                </button>
                <div id="setupError" class="text-red-400 text-xs text-center hidden-el"></div>
            </div>
        </div>

        <!-- 2. Lobby View -->
        <div id="view-lobby" class="hidden-el bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800 shrink-0">
                <div>
                    <h2 class="text-base font-semibold text-white">Active Lobby</h2>
                    <p class="text-xs text-slate-400" id="lobbyStatus">Updating...</p>
                </div>
                <div class="px-3 py-1 bg-slate-800 rounded-full text-xs font-medium text-slate-300 border border-slate-700 flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="myDisplayName">Me</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto mb-4 space-y-2 pr-1" id="lobbyUsersList">
                <!-- Users injected here -->
                <div class="text-center text-sm text-slate-500 py-8">Fetching users...</div>
            </div>

            <div class="shrink-0 pt-3 border-t border-slate-800">
                <button onclick="createTeamFromSelection()" class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-xl px-4 py-3 transition-all active:scale-95 flex items-center justify-center gap-2" id="createTeamBtn" disabled>
                    <i class="ph ph-users-three"></i>
                    <span>Create Team from Selection</span>
                </button>
            </div>
        </div>

        <!-- 3. Active Session View -->
        <div id="view-session" class="hidden-el bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800 shrink-0">
                <div>
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="ph-fill ph-broadcast text-emerald-500"></i> Active Comms
                    </h2>
                    <p class="text-xs text-slate-400" id="sessionStatus">0 peers connected</p>
                </div>
                <button onclick="leaveSession()" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-xs font-medium border border-red-500/20 transition-colors">
                    Leave
                </button>
            </div>

            <div class="flex-1 overflow-y-auto mb-4 space-y-2" id="activePeersList">
                <!-- Connected peers injected here -->
                <div class="text-center text-sm text-slate-500 py-8">Waiting for connection...</div>
            </div>

            <div class="shrink-0 pt-4">
                <button id="pttBtn" 
                    onmousedown="startTalk()" onmouseup="stopTalk()" onmouseleave="stopTalk()"
                    ontouchstart="startTalk(event)" ontouchend="stopTalk(event)" ontouchcancel="stopTalk(event)"
                    class="w-full bg-slate-800 border-2 border-slate-700 hover:bg-slate-750 hover:border-emerald-500/50 text-slate-300 font-bold rounded-2xl p-6 transition-all select-none touch-none flex flex-col items-center justify-center gap-2 cursor-pointer">
                    <i id="pttIcon" class="ph-fill ph-microphone-stage text-4xl mb-1"></i>
                    <span id="pttLabel" class="text-sm uppercase tracking-widest">Hold to Speak</span>
                </button>
                <p class="text-center text-[10px] text-slate-500 mt-3 font-mono">Or hold SPACEBAR</p>
            </div>
        </div>

        <!-- System Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shrink-0 h-24 overflow-y-auto font-mono text-[10px]" id="systemLog">
            <div class="text-slate-500">System ready...</div>
        </div>
    </div>

    <div id="audioContainer" class="hidden-el"></div>

    <script>
        /* --- State --- */
        let myId = null;
        let myName = '';
        let peer = null;
        let localStream = null;
        let activeConnections = {}; // { peerId: { name, conn, call, audioEl, isTalking } }
        let lobbyInterval = null;
        let isTalking = false;

        /* --- UI Helpers --- */
        function switchView(viewId) {
            ['view-setup', 'view-lobby', 'view-session'].forEach(id => {
                document.getElementById(id).classList.add('hidden-el');
            });
            document.getElementById(viewId).classList.remove('hidden-el');
        }

        function logInfo(msg, type = 'info') {
            const logEl = document.getElementById('systemLog');
            const d = new Date();
            const time = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            const colors = { info: 'text-slate-400', success: 'text-emerald-400', error: 'text-red-400', warn: 'text-yellow-400' };
            
            const div = document.createElement('div');
            div.className = colors[type];
            div.innerText = `[${time}] ${msg}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function showError(msg) {
            const errEl = document.getElementById('setupError');
            errEl.innerText = msg;
            errEl.classList.remove('hidden-el');
            setTimeout(() => errEl.classList.add('hidden-el'), 4000);
        }

        /* --- Microphone --- */
        async function getMicrophone() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                muteMicrophone(); // Start muted
                logInfo('Microphone access granted', 'success');
                return true;
            } catch(e) {
                logInfo('Microphone denied: ' + e.message, 'error');
                showError('Microphone access is required.');
                return false;
            }
        }
        function muteMicrophone()   { if(localStream) localStream.getAudioTracks().forEach(t => t.enabled = false); }
        function unmuteMicrophone() { if(localStream) localStream.getAudioTracks().forEach(t => t.enabled = true); }

        /* --- PeerJS Config --- */
        function getPeerConfig() {
            // Uses public servers for prototype, but attempts to use your local server if running
            const selfHosted = location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && location.protocol !== 'file:';
            return {
                debug: 0,
                path: '/peerjs',
                host: location.hostname || '0.peerjs.com',
                port: location.port || (location.hostname ? 443 : undefined),
                secure: location.protocol === 'https:'
            };
        }

        /* --- Initialization --- */
        async function joinApp() {
            myName = document.getElementById('myNameInput').value.trim();
            if(!myName) return showError("Please enter a name.");

            const btn = document.getElementById('joinBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Connecting...';

            const micOk = await getMicrophone();
            if(!micOk) { btn.disabled = false; btn.innerHTML = 'Connect & Join Lobby'; return; }

            // Generate unique ID
            myId = 'iq-' + Math.random().toString(36).substring(2, 10);
            peer = new Peer(myId, getPeerConfig());

            peer.on('open', async (id) => {
                logInfo(`Connected to mesh broker. ID: ${id}`, 'success');
                document.getElementById('myDisplayName').innerText = myName;
                
                // Try to register with backend (Fail gracefully if prototype server isn't running)
                try {
                    await fetch(`/register/${id}/${encodeURIComponent(myName)}`);
                    logInfo('Registered with directory server.', 'success');
                } catch(e) {
                    logInfo('Local prototype mode (Server fetch failed).', 'warn');
                }

                setupPeerListeners();
                switchView('view-lobby');
                startLobbyPolling();
            });

            peer.on('error', (err) => {
                logInfo('Network Error: ' + err.message, 'error');
                btn.disabled = false; btn.innerHTML = 'Connect & Join Lobby';
                showError("Network connection failed.");
            });
        }

        /* --- Lobby Logic --- */
        function startLobbyPolling() {
            fetchLobby();
            lobbyInterval = setInterval(fetchLobby, 3000);
        }

        async function fetchLobby() {
            try {
                const res = await fetch('/users');
                if(!res.ok) throw new Error("Server response not OK");
                const users = await res.json();
                renderLobby(users);
                document.getElementById('lobbyStatus').innerText = `${users.length} total active users`;
            } catch(e) {
                // If server isn't running, show mock for UI demonstration purposes
                document.getElementById('lobbyStatus').innerText = `Directory offline (Manual connect only)`;
                // For a true prototype, we might want to manually input IDs, but we will mock a user for demo if failed:
                if(document.getElementById('lobbyUsersList').children.length === 1 && document.getElementById('lobbyUsersList').children[0].innerText.includes('Fetching')) {
                   document.getElementById('lobbyUsersList').innerHTML = `<div class="text-xs text-slate-500 text-center py-4">Cannot reach /users endpoint.<br>Ensure Node.js server is running.</div>`;
                }
            }
        }

        function renderLobby(users) {
            const list = document.getElementById('lobbyUsersList');
            const activeIds = Object.keys(activeConnections);
            
            let html = '';
            let validUsers = 0;

            users.forEach(u => {
                if(u.id === myId) return; // Skip self
                validUsers++;
                const isConnected = activeIds.includes(u.id);
                
                html += `
                <label class="flex items-center gap-3 p-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer hover:border-slate-600 transition-colors">
                    <input type="checkbox" value="${u.id}" data-name="${u.name}" class="lobby-checkbox w-4 h-4 text-emerald-500 rounded border-slate-700 bg-slate-900 focus:ring-emerald-500" ${isConnected ? 'disabled' : ''} onchange="updateTeamBtn()">
                    <div class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-xs font-bold shrink-0">
                        ${u.name.substring(0,2).toUpperCase()}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium text-slate-200 truncate">${u.name}</div>
                        <div class="text-[10px] ${isConnected ? 'text-emerald-400' : 'text-slate-500'}">${isConnected ? '● Connected' : '○ Available'}</div>
                    </div>
                    ${!isConnected ? 
                        `<button type="button" onclick="connectToUsers([{id:'${u.id}', name:'${u.name}'}]); event.preventDefault();" class="px-3 py-1.5 bg-slate-800 hover:bg-emerald-600 hover:text-white text-emerald-500 rounded-lg text-xs font-medium transition-colors">Call</button>` 
                        : `<span class="text-xs text-slate-600 px-3 py-1.5">In Session</span>`
                    }
                </label>`;
            });

            if(validUsers === 0) {
                html = `<div class="text-center text-sm text-slate-500 py-8">No other users online.</div>`;
            }
            list.innerHTML = html;
        }

        function updateTeamBtn() {
            const checked = document.querySelectorAll('.lobby-checkbox:checked');
            const btn = document.getElementById('createTeamBtn');
            btn.disabled = checked.length < 1;
            btn.innerHTML = `<i class="ph ph-users-three"></i> <span>Create Team (${checked.length})</span>`;
        }

        function createTeamFromSelection() {
            const checked = document.querySelectorAll('.lobby-checkbox:checked');
            const targets = Array.from(checked).map(cb => ({ id: cb.value, name: cb.dataset.name }));
            if(targets.length > 0) connectToUsers(targets);
        }

        /* --- Connecting Logic --- */
        function connectToUsers(targets) {
            clearInterval(lobbyInterval); // Stop lobby updates while in session
            switchView('view-session');
            
            targets.forEach(target => {
                if(activeConnections[target.id]) return;
                logInfo(`Dialing ${target.name}...`, 'info');
                
                // 1. Data Connection (for signaling PTT state)
                const conn = peer.connect(target.id, { metadata: { name: myName } });
                // 2. Media Connection (for Voice)
                const call = peer.call(target.id, localStream, { metadata: { name: myName } });
                
                setupActivePeer(target.id, target.name, conn, call);
            });
            renderActiveSession();
        }

        /* --- Incoming Handling --- */
        function setupPeerListeners() {
            // Incoming Data Connection
            peer.on('connection', (conn) => {
                const callerName = conn.metadata?.name || 'Unknown';
                logInfo(`${callerName} joined data channel.`, 'info');
                
                if(!activeConnections[conn.peer]) {
                    activeConnections[conn.peer] = { name: callerName, isTalking: false };
                }
                activeConnections[conn.peer].conn = conn;
                
                conn.on('data', (data) => handlePeerData(conn.peer, data));
                conn.on('close', () => handlePeerLeave(conn.peer));
                
                // Switch to session view automatically on incoming
                clearInterval(lobbyInterval);
                switchView('view-session');
                renderActiveSession();
            });

            // Incoming Voice Call (Auto-Answer Walkie-Talkie magic)
            peer.on('call', (call) => {
                const callerName = call.metadata?.name || 'Unknown';
                logInfo(`Auto-answering voice from ${callerName}`, 'success');
                
                call.answer(localStream); // AUTO ANSWER
                
                if(!activeConnections[call.peer]) {
                    activeConnections[call.peer] = { name: callerName, isTalking: false };
                }
                activeConnections[call.peer].call = call;
                
                call.on('stream', (remoteStream) => {
                    attachAudio(call.peer, remoteStream);
                });
                call.on('close', () => handlePeerLeave(call.peer));
                
                clearInterval(lobbyInterval);
                switchView('view-session');
                renderActiveSession();
            });
        }

        function setupActivePeer(id, name, conn, call) {
            activeConnections[id] = { name, conn, call, isTalking: false };
            
            conn.on('open', () => {
                logInfo(`Connected to ${name}`, 'success');
                renderActiveSession();
            });
            conn.on('data', (data) => handlePeerData(id, data));
            conn.on('close', () => handlePeerLeave(id));

            call.on('stream', (remoteStream) => {
                logInfo(`Receiving audio from ${name}`, 'success');
                attachAudio(id, remoteStream);
            });
            call.on('close', () => handlePeerLeave(id));
        }

        function attachAudio(id, stream) {
            let existing = document.getElementById('audio-' + id);
            if (existing) existing.remove();
            
            const audio = document.createElement('audio');
            audio.id = 'audio-' + id;
            audio.autoplay = true;
            audio.playsInline = true;
            audio.srcObject = stream;
            document.getElementById('audioContainer').appendChild(audio);
            
            if(activeConnections[id]) activeConnections[id].audioEl = audio;
        }

        /* --- Push To Talk Logic --- */
        function startTalk(e) {
            if(e) e.preventDefault();
            if(isTalking || Object.keys(activeConnections).length === 0) return;
            
            isTalking = true;
            unmuteMicrophone();
            
            // Update UI
            const btn = document.getElementById('pttBtn');
            btn.classList.add('ptt-active');
            btn.classList.replace('bg-slate-800', 'bg-emerald-600');
            btn.classList.replace('text-slate-300', 'text-white');
            document.getElementById('pttLabel').innerText = "Transmitting...";
            document.getElementById('pttIcon').innerHTML = '<div class="wave-bar"><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div></div>';
            
            // Broadcast state to all connected peers
            broadcastData({ type: 'ptt-start' });
        }

        function stopTalk(e) {
            if(e) e.preventDefault();
            if(!isTalking) return;
            
            isTalking = false;
            muteMicrophone();
            
            // Update UI
            const btn = document.getElementById('pttBtn');
            btn.classList.remove('ptt-active');
            btn.classList.replace('bg-emerald-600', 'bg-slate-800');
            btn.classList.replace('text-white', 'text-slate-300');
            document.getElementById('pttLabel').innerText = "Hold to Speak";
            document.getElementById('pttIcon').innerHTML = '';
            document.getElementById('pttIcon').className = 'ph-fill ph-microphone-stage text-4xl mb-1';
            
            // Broadcast state
            broadcastData({ type: 'ptt-stop' });
        }

        function broadcastData(msg) {
            Object.values(activeConnections).forEach(p => {
                if(p.conn && p.conn.open) p.conn.send(msg);
            });
        }

        function handlePeerData(id, data) {
            if(!activeConnections[id]) return;
            
            if(data.type === 'ptt-start') {
                activeConnections[id].isTalking = true;
                logInfo(`${activeConnections[id].name} is speaking.`, 'info');
                renderActiveSession(); // Update UI to show talking indicator
            }
            if(data.type === 'ptt-stop') {
                activeConnections[id].isTalking = false;
                renderActiveSession();
            }
        }

        /* --- Session Management --- */
        function renderActiveSession() {
            const list = document.getElementById('activePeersList');
            const count = Object.keys(activeConnections).length;
            document.getElementById('sessionStatus').innerText = `${count} peer${count!==1?'s':''} connected`;

            if(count === 0) {
                list.innerHTML = `<div class="text-center text-sm text-slate-500 py-8">Session empty. You can leave.</div>`;
                return;
            }

            let html = '';
            Object.values(activeConnections).forEach(p => {
                const statusColor = p.isTalking ? 'text-amber-400' : 'text-emerald-400';
                const statusText = p.isTalking ? '🎙️ Receiving...' : '● Connected';
                const bgGlow = p.isTalking ? 'border-amber-500/50 bg-amber-500/10' : 'border-slate-800 bg-slate-950';

                html += `
                <div class="flex items-center gap-3 p-3 border rounded-xl transition-all ${bgGlow}">
                    <div class="w-10 h-10 rounded-full bg-slate-800 text-slate-200 flex items-center justify-center font-bold shrink-0 shadow-inner">
                        ${p.name.substring(0,2).toUpperCase()}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-semibold text-white truncate">${p.name}</div>
                        <div class="text-xs ${statusColor} mt-0.5 transition-colors duration-200">${statusText}</div>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        }

        function handlePeerLeave(id) {
            if(!activeConnections[id]) return;
            logInfo(`${activeConnections[id].name} disconnected.`, 'warn');
            if(activeConnections[id].audioEl) activeConnections[id].audioEl.remove();
            delete activeConnections[id];
            renderActiveSession();
        }

        function leaveSession() {
            // Close all connections
            Object.values(activeConnections).forEach(p => {
                if(p.conn) p.conn.close();
                if(p.call) p.call.close();
                if(p.audioEl) p.audioEl.remove();
            });
            activeConnections = {};
            logInfo('Left active session.', 'warn');
            
            // Return to Lobby
            switchView('view-lobby');
            startLobbyPolling();
        }

        /* --- Keyboard Binding --- */
        document.addEventListener('keydown', e => { 
            if (e.code === 'Space' && !e.repeat && document.getElementById('view-session').classList.contains('hidden-el') === false) { 
                e.preventDefault(); startTalk(); 
            } 
        });
        document.addEventListener('keyup', e => { 
            if (e.code === 'Space') { 
                e.preventDefault(); stopTalk(); 
            } 
        });
    </script>
</body>
</html>
